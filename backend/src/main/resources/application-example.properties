spring.application.name=employee-portal

# Jwt
app.jwt.secret={your-secret-here}
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/eps
spring.datasource.username={your-username-here}
spring.datasource.password={your-password-here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# AI
ai.provider=gemini or openai
ai.gemini.api.key={your-api-key-here}
ai.openai.api.key={your-api-key-here}
ai.rate-limit.max-requests=10

# MiniO
storage.endpoint=http://localhost:9000
storage.bucket=eps-file-storage
storage.access-key={your-access-key-here}
storage.secret-key={your-secret-key-here}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8080